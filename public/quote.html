<section class="section"><div class="container"><form class="form" action="mailto:hello@example.com" method="post" enctype="text/plain"><div class="formgrid">
<div class="field"><label>Nom / société</label><input name="client" required placeholder="Entreprise ou nom"></div>

<div class="field"><label>Type de projet</label><select name="type"><option>Application web</option><option>API / intégration</option><option>Refonte / modernisation</option><option>Mission d’expertise</option><option>DevOps / CI-CD</option></select></div>

<div class="field"><label>Délai souhaité</label><input name="delai" placeholder="Ex. 2 à 3 mois"></div>
<div class="field"><label>Technologie imposée</label><input name="stack" placeholder="Ex. Laravel / Vue / Docker"></div>
<div class="field full"><label>Décrivez le projet</label><textarea name="description" required placeholder="Objectifs, utilisateurs, fonctionnalités, contraintes, existant..."></textarea></div>
</div><label class="check"><input type="checkbox" required> J’accepte que ces informations soient utilisées uniquement pour répondre à ma demande.</label><button class="btn primary submit" type="submit">Demander une première estimation →</button></form></div></section>
